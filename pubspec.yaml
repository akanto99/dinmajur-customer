name: dinmajur_customer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.21+28

environment:
  sdk: ^3.8.1

# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.2
  fluttertoast: ^8.2.12
  another_flushbar: ^1.12.30
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  http: ^1.3.0

  intl: ^0.20.2
  dropdown_button2: ^2.3.9
  image_picker: ^1.0.1
  file_picker: ^10.2.0
  open_file: ^3.5.10


  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.3

  geolocator: ^14.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.12.2
  google_places_flutter: ^2.1.0

  url_launcher: ^6.3.1
  upgrader: ^12.3.0
  image: ^4.8.0
  image_cropper: ^9.1.0
  loading_animation_widget: ^1.3.0
  crop_your_image: ^2.0.0

  internet_connection_checker_plus: ^2.9.1+2
  font_awesome_flutter: ^10.8.0
  slide_switcher: ^1.1.2
  device_info_plus: ^12.3.0
  timeago: ^3.7.1
  flutter_html: ^3.0.0
  flutter_dotenv: ^6.0.0

  webview_flutter: ^4.13.0
  cached_network_image: ^3.4.1
#  Payment SSL Commerze
  flutter_sslcommerz: ^3.0.1
  #  One Signal Integration
  onesignal_flutter: ^5.3.5
  wakelock_plus: ^1.4.0

  flutter_sticky_header: ^0.8.0

  pinput: ^6.0.1
  smart_auth: ^3.2.0

  carousel_slider: ^5.1.2


  flutter_localizations:
    sdk: flutter
  socket_io_client: ^3.1.2



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  image: ^4.8.0


flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
    - assets/images/splash/
    - assets/images/onboard/
    - assets/images/onboard/icons/
    - assets/images/login/
    #    - assets/images/navBar/
    - assets/images/navBar/navbar_new/
    - assets/images/home/
#    - assets/images/home/home_screen/
    - assets/images/home/drawer/
    #    - assets/images/order/


    - assets/map_theme/nighttheme.json
    - assets/map_theme/standaredtheme.json

  fonts:
    - family: hindSiliguri
      fonts:
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/hind-siliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/hind-siliguri/HindSiliguri-Bold.ttf
          weight: 700

    - family: poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700




